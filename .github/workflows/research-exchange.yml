name: Research exchange

on:
  pull_request:
    paths:
      - 'lib/game/cognition/researchExchange.ts'
      - 'lib/game/cognition/researchExchange.test.ts'
      - 'lib/game/cognition/runtime.ts'
      - 'docs/core/RESEARCH_EXCHANGE.md'
      - '.github/workflows/research-exchange.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/cognition/researchExchange.ts'
      - 'lib/game/cognition/researchExchange.test.ts'

jobs:
  research-exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc lib/game/cognition/researchExchange.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .research-exchange-test
      - run: node .research-exchange-test/game/cognition/researchExchange.test.js
