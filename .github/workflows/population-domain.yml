name: Population domain

on:
  pull_request:
    paths:
      - 'lib/game/population/**'
      - 'lib/game/personSocialMemory.ts'
      - 'lib/game/personBrain.ts'
      - 'lib/game/tick.ts'
      - 'app/api/game/population/encounters/**'
      - 'package.json'
      - '.github/workflows/population-domain.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/game/population/**'
      - 'lib/game/personSocialMemory.ts'
      - 'lib/game/personBrain.ts'
      - 'lib/game/tick.ts'
      - 'app/api/game/population/encounters/**'
      - 'package.json'
      - '.github/workflows/population-domain.yml'

jobs:
  population-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate population contracts
        run: npm run test:population
      - name: Compile population persistence engine
        run: npx tsc lib/game/population/engine.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --noEmit
      - name: Compile authoritative tick orchestration
        run: npx tsc lib/game/tick.ts lib/game/personBrain.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --noEmit
      - name: Validate Core invariants
        run: npm run test:core-invariants
