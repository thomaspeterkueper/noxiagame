name: Population domain

on:
  pull_request:
    paths:
      - 'lib/game/population/**'
      - 'lib/game/personSocialMemory.ts'
      - 'lib/game/personBrain.ts'
      - 'lib/game/tick.ts'
      - 'app/api/game/population/encounters/**'
      - 'package.json'
      - '.github/workflows/population-domain.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/game/population/**'
      - 'lib/game/personSocialMemory.ts'
      - 'lib/game/personBrain.ts'
      - 'lib/game/tick.ts'
      - 'app/api/game/population/encounters/**'
      - 'package.json'
      - '.github/workflows/population-domain.yml'

jobs:
  population-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate population contracts
        run: pnpm run test:population
      - name: Compile population persistence engine
        run: pnpm exec tsc lib/game/population/engine.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --noEmit
      - name: Compile authoritative tick orchestration
        run: pnpm exec tsc -p tsconfig.tick-ci.json
      - name: Validate Core invariants
        run: pnpm run test:core-invariants
      - name: Reproduce production Next build
        env:
          # CI-only placeholders: page-data collection requires Supabase configuration even
          # though population tests do not access Supabase. No production credentials here.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: pnpm run build
