name: Prototype measurement contract
on:
  pull_request:
    paths:
      - 'lib/game/population/prototypeExperiment.ts'
      - 'lib/game/population/prototypeExperiment.test.ts'
      - '.github/workflows/prototype-measurement.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc lib/game/population/prototypeExperiment.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .prototype-measurement-test
      - run: node .prototype-measurement-test/game/population/prototypeExperiment.test.js
