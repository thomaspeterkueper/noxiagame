name: Earth surface readiness

on:
  pull_request:
    paths:
      - 'lib/game/earthSurfaceEngineering.ts'
      - 'lib/game/earthSurfaceEngineering.test.ts'
      - 'lib/game/vehicles/surfaceProfileResolution.ts'
      - 'lib/game/core/logisticsCargoMass.ts'
      - 'lib/game/core/logisticsCargoMassAuthority.ts'
      - 'app/api/game/surface-transport/cargo-readiness/route.ts'
      - 'app/api/game/earth/surface-transport/readiness/route.ts'
      - 'app/api/game/earth/surface-transport/draft/route.ts'
      - 'app/api/game/earth/surface-transport/start/route.ts'
      - 'app/earth/EarthSurfaceLogisticsConsole.tsx'
      - 'app/earth/EarthSurfaceLogisticsOverlay.tsx'
      - 'app/earth/EarthRegionPreview.tsx'
      - 'app/earth/page.tsx'
      - 'app/api/game/moon/surface-transport/cargo-readiness/route.ts'
      - '.github/workflows/earth-surface-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/earthSurfaceEngineering.ts'
      - 'lib/game/earthSurfaceEngineering.test.ts'
      - 'lib/game/vehicles/surfaceProfileResolution.ts'
      - 'lib/game/core/logisticsCargoMass.ts'
      - 'lib/game/core/logisticsCargoMassAuthority.ts'
      - 'app/api/game/surface-transport/cargo-readiness/route.ts'
      - 'app/api/game/earth/surface-transport/readiness/route.ts'
      - 'app/api/game/earth/surface-transport/draft/route.ts'
      - 'app/api/game/earth/surface-transport/start/route.ts'
      - 'app/earth/EarthSurfaceLogisticsConsole.tsx'
      - 'app/earth/EarthSurfaceLogisticsOverlay.tsx'
      - 'app/earth/EarthRegionPreview.tsx'
      - 'app/earth/page.tsx'
      - 'app/api/game/moon/surface-transport/cargo-readiness/route.ts'
      - '.github/workflows/earth-surface-readiness.yml'

jobs:
  earth-surface-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify shared cargo mass contract
        run: >-
          pnpm exec tsc lib/game/core/logisticsCargoMass.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-readiness-test
          && node .earth-readiness-test/game/core/logisticsCargoMass.test.js
      - name: Verify Earth engineering registry stays fail-closed
        run: >-
          pnpm exec tsc lib/game/earthSurfaceEngineering.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-readiness-test
          && node .earth-readiness-test/game/earthSurfaceEngineering.test.js
      - name: Lint Earth surface transport client
        # The legacy console predates the React set-state-in-effect rule and already
        # contains initialization/readiness effects tracked outside this PR. Keep all
        # other lint rules active while avoiding unrelated scope expansion here.
        run: >-
          pnpm exec eslint app/earth/EarthSurfaceLogisticsConsole.tsx
          --rule 'react-hooks/set-state-in-effect: off'
      - name: Lint canonical Earth logistics overlay
        run: pnpm exec eslint app/earth/EarthSurfaceLogisticsOverlay.tsx app/earth/page.tsx
