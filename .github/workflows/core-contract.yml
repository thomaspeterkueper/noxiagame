name: Core contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'docs/core/**'
      - 'docs/decisions/ADR-npcs-sind-spieler.md'
      - 'scripts/check-core-contract.mjs'
      - 'scripts/check-core-ownership-invariants.mjs'
      - 'scripts/check-core-location-invariants.mjs'
      - 'scripts/check-core-time-invariants.mjs'
      - 'scripts/check-core-resource-invariants.mjs'
      - 'scripts/check-core-research-invariants.mjs'
      - 'scripts/check-core-actor-invariants.mjs'
      - 'lib/knowledge/**'
      - 'app/api/game/knowledge/**'
      - 'app/api/game/build/**'
      - 'app/api/game/colony/**'
      - 'app/api/cron/**'
      - 'package.json'
      - '.github/workflows/core-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'docs/core/**'
      - 'docs/decisions/ADR-npcs-sind-spieler.md'
      - 'scripts/check-core-contract.mjs'
      - 'scripts/check-core-ownership-invariants.mjs'
      - 'scripts/check-core-location-invariants.mjs'
      - 'scripts/check-core-time-invariants.mjs'
      - 'scripts/check-core-resource-invariants.mjs'
      - 'scripts/check-core-research-invariants.mjs'
      - 'scripts/check-core-actor-invariants.mjs'
      - 'lib/knowledge/**'
      - 'app/api/game/knowledge/**'
      - 'app/api/game/build/**'
      - 'app/api/game/colony/**'
      - 'app/api/cron/**'
      - 'package.json'
      - '.github/workflows/core-contract.yml'

jobs:
  core-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared Core contracts
        run: npm run test:core-invariants
