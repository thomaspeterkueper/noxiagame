name: Population Seed Contract

on:
  push:
    paths:
      - 'lib/game/population/tharsisActivePopulationSeed.test.ts'
      - 'lib/game/seeds/tharsisHubSeed.ts'
      - 'supabase/migrations/*tharsis_active_population_seed*'
      - '.github/workflows/population-seed.yml'
  pull_request:
    paths:
      - 'lib/game/population/tharsisActivePopulationSeed.test.ts'
      - 'lib/game/seeds/tharsisHubSeed.ts'
      - 'supabase/migrations/*tharsis_active_population_seed*'
      - '.github/workflows/population-seed.yml'

jobs:
  population-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run population seed contract guard
        run: pnpm run test:population-seed
