name: Spatial domain

on:
  pull_request:
    paths:
      - 'lib/game/spatial/**'
      - 'app/api/game/build/spatial/**'
      - 'app/api/game/spatial/**'
      - 'supabase/migrations/**spatial**'
      - 'supabase/migrations/**terrain**'
      - 'package.json'
      - '.github/workflows/spatial-domain.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/spatial/**'
      - 'app/api/game/build/spatial/**'
      - 'app/api/game/spatial/**'
      - 'supabase/migrations/**spatial**'
      - 'supabase/migrations/**terrain**'
      - 'package.json'
      - '.github/workflows/spatial-domain.yml'

jobs:
  spatial-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:spatial
      # Shared walkable-scene interactions use Vitest and are not part of test:spatial.
      - name: Verify local scene entry and collision regression
        run: pnpm exec vitest run lib/game/spatial/localSceneRuntime.test.ts
