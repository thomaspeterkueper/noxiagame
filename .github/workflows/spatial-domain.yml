name: Spatial domain

on:
  pull_request:
    paths:
      - 'lib/game/spatial/**'
      - 'app/api/game/build/spatial/**'
      - 'app/api/game/spatial/**'
      - 'supabase/migrations/**spatial**'
      - 'supabase/migrations/**terrain**'
      - 'package.json'
      - '.github/workflows/spatial-domain.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/spatial/**'
      - 'app/api/game/build/spatial/**'
      - 'app/api/game/spatial/**'
      - 'supabase/migrations/**spatial**'
      - 'supabase/migrations/**terrain**'
      - 'package.json'
      - '.github/workflows/spatial-domain.yml'

jobs:
  spatial-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:spatial
