name: Scanner Domain

on:
  push:
    paths:
      - 'lib/game/scanning.ts'
      - 'lib/game/scanning.test.ts'
      - 'app/api/game/scanner/**'
      - 'app/scanner/**'
      - 'supabase/migrations/*scanner*'
      - '.github/workflows/scanner-domain.yml'
  pull_request:
    paths:
      - 'lib/game/scanning.ts'
      - 'lib/game/scanning.test.ts'
      - 'app/api/game/scanner/**'
      - 'app/scanner/**'
      - 'supabase/migrations/*scanner*'
      - '.github/workflows/scanner-domain.yml'

jobs:
  scanner-domain:
    runs-on: ubuntu-latest
    env:
      # Build-only values: Next.js evaluates Supabase clients while collecting
      # route metadata. Scanner domain tests do not access this endpoint.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile scanner domain test
        run: npx tsc lib/game/scanning.ts lib/game/scanning.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .scanner-test
      - name: Run scanner domain test
        run: node .scanner-test/scanning.test.js
      - name: Verify application build
        run: npm run build
