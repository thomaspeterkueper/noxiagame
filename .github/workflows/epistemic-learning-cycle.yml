name: Epistemic learning cycle

on:
  pull_request:
    paths:
      - 'lib/game/population/informationLearning.ts'
      - 'lib/game/population/informationLearning.test.ts'
      - 'lib/game/population/informationGatheringIntent.ts'
      - 'lib/game/population/decisionSufficiency.ts'
      - 'lib/game/population/observation.ts'
      - '.github/workflows/epistemic-learning-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/population/informationLearning.ts'
      - 'lib/game/population/informationLearning.test.ts'

jobs:
  learning-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc lib/game/population/informationLearning.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .epistemic-learning-test
      - run: node .epistemic-learning-test/game/population/informationLearning.test.js
