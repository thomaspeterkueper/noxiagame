name: World Development Contract

on:
  push:
    paths:
      - 'lib/game/worldDevelopment.ts'
      - 'lib/game/worldDevelopmentSignals.ts'
      - 'lib/game/energyGridObservation.ts'
      - 'lib/game/energyGridObservation.test.ts'
      - 'lib/game/seeds/tharsisHubSeed.ts'
      - 'lib/game/worldDevelopment.test.ts'
      - 'app/api/game/world-development/**'
      - 'app/dashboard/DashboardWorldDevelopmentOverlay.tsx'
      - 'app/dashboard/DashboardGate.tsx'
      - 'supabase/migrations/20260915164500_tharsis_energy_reconciliation.sql'
      - 'supabase/migrations/20260915173000_tharsis_power_grid_topology_e1.sql'
      - 'scripts/check-tharsis-energy-reconciliation.mjs'
      - 'scripts/check-tharsis-power-grid-e1.mjs'
      - 'docs/decisions/ADR-world-development-macro-system.md'
      - 'docs/architecture/world-development-model.md'
      - 'docs/core/CORE_CONTRACT.md'
      - 'package.json'
      - '.github/workflows/world-development.yml'
  pull_request:
    paths:
      - 'lib/game/worldDevelopment.ts'
      - 'lib/game/worldDevelopmentSignals.ts'
      - 'lib/game/energyGridObservation.ts'
      - 'lib/game/energyGridObservation.test.ts'
      - 'lib/game/seeds/tharsisHubSeed.ts'
      - 'lib/game/worldDevelopment.test.ts'
      - 'app/api/game/world-development/**'
      - 'app/dashboard/DashboardWorldDevelopmentOverlay.tsx'
      - 'app/dashboard/DashboardGate.tsx'
      - 'supabase/migrations/20260915164500_tharsis_energy_reconciliation.sql'
      - 'supabase/migrations/20260915173000_tharsis_power_grid_topology_e1.sql'
      - 'scripts/check-tharsis-energy-reconciliation.mjs'
      - 'scripts/check-tharsis-power-grid-e1.mjs'
      - 'docs/decisions/ADR-world-development-macro-system.md'
      - 'docs/architecture/world-development-model.md'
      - 'docs/core/CORE_CONTRACT.md'
      - 'package.json'
      - '.github/workflows/world-development.yml'

jobs:
  world-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Core invariants
        run: npm run test:core-invariants
      - name: Validate Tharsis energy reconciliation
        run: node scripts/check-tharsis-energy-reconciliation.mjs
      - name: Validate Tharsis E1 power-grid migration
        run: node scripts/check-tharsis-power-grid-e1.mjs
      - name: Run Tharsis E1 topology observation tests
        run: >-
          npx tsc lib/game/energyGridObservation.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .energy-grid-test
          && node .energy-grid-test/game/energyGridObservation.test.js
      - name: Run world-development projection contract
        run: npm run test:world-development
