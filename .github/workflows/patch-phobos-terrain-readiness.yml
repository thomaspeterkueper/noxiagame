name: Patch Phobos terrain readiness

on:
  push:
    branches:
      - fix/phobos-terrain-readiness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[terrain-readiness-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phobos-terrain-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply narrow readiness fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          spatial = Path('app/api/game/build/spatial/route.ts')
          text = spatial.read_text()
          old = "if (!frame || frame.origin_status !== 'verified' || frame.origin_lat_deg == null || frame.origin_lon_deg == null || frame.origin_alt_m == null) {"
          new = "if (!frame || frame.origin_status === 'pending' || frame.origin_lat_deg == null || frame.origin_lon_deg == null || frame.origin_alt_m == null) {"
          if old not in text:
              raise SystemExit('spatial readiness guard not found')
          spatial.write_text(text.replace(old, new, 1))

          imp = Path('app/api/admin/import-phobos-dem/route.ts')
          text = imp.read_text()
          old = "    const manifest = await ingestPreparedTerrainTileToSupabase(supabase, {\n      datasetId: DATASET_ID,"
          new = "    const manifest = await ingestPreparedTerrainTileToSupabase(supabase, {\n      datasetId: DATASET_ID,"
          if old not in text:
              raise SystemExit('phobos ingest call not found')
          marker = "    return NextResponse.json({\n      ok: true,"
          if marker not in text:
              raise SystemExit('phobos success return not found')
          insert = "    const { error: datasetReadyError } = await supabase\n      .from('terrain_datasets')\n      .update({ status: 'ready' })\n      .eq('id', DATASET_ID)\n    if (datasetReadyError) throw new Error(`Phobos terrain dataset readiness update failed: ${datasetReadyError.message}`)\n\n"
          imp.write_text(text.replace(marker, insert + marker, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/game/build/spatial/route.ts app/api/admin/import-phobos-dem/route.ts
          git commit -m "fix(phobos): accept derived terrain origin and persist ready dataset [terrain-readiness-patched]"
          git push origin HEAD:fix/phobos-terrain-readiness
