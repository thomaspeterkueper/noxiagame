name: Vehicle domain

on:
  pull_request:
    paths:
      - 'lib/game/vehicles/**'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/moonSurfaceLogistics.ts'
      - 'supabase/migrations/*vehicle*.sql'
      - 'package.json'
      - '.github/workflows/vehicle-domain.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/vehicles/**'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/moonSurfaceLogistics.ts'
      - 'supabase/migrations/*vehicle*.sql'
      - 'package.json'
      - '.github/workflows/vehicle-domain.yml'

jobs:
  vehicle-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:vehicles
