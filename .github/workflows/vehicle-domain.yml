name: Vehicle domain

on:
  pull_request:
    paths:
      - 'lib/game/vehicles/**'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/earthSurfaceMission.ts'
      - 'lib/game/earthSurfaceRouteGeometry.ts'
      - 'lib/game/earthSurfaceEngineering.ts'
      - 'lib/game/moonSurfaceLogistics.ts'
      - 'app/api/game/earth/surface-transport/**'
      - 'app/earth/EarthSurfaceMissionDraftPanel.tsx'
      - 'supabase/migrations/*vehicle*.sql'
      - 'package.json'
      - '.github/workflows/vehicle-domain.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/vehicles/**'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/earthSurfaceMission.ts'
      - 'lib/game/earthSurfaceRouteGeometry.ts'
      - 'lib/game/earthSurfaceEngineering.ts'
      - 'lib/game/moonSurfaceLogistics.ts'
      - 'app/api/game/earth/surface-transport/**'
      - 'app/earth/EarthSurfaceMissionDraftPanel.tsx'
      - 'supabase/migrations/*vehicle*.sql'
      - 'package.json'
      - '.github/workflows/vehicle-domain.yml'

jobs:
  vehicle-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:vehicles
