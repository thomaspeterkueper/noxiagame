name: Apply generic spatial terrain runtime patch

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-spatial-runtime-route.mjs'
      - '.github/workflows/apply-spatial-runtime-route-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic route patch
        run: node scripts/patch-spatial-runtime-route.mjs
      - name: Commit route patch
        run: |
          if git diff --quiet -- app/api/game/build/spatial/route.ts; then
            echo "No route changes required"
            exit 0
          fi
          git config user.name "NOXIA Terrain Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/game/build/spatial/route.ts
          git commit -m "refactor(spatial): use shared terrain runtime registry"
          git push origin HEAD:main
