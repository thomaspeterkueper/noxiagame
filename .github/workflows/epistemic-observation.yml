name: Epistemic observation contract

on:
  pull_request:
    paths:
      - 'lib/game/population/observation.ts'
      - 'lib/game/population/observation.test.ts'
      - 'lib/game/population/types.ts'
      - 'docs/core/EPISTEMIC_OBSERVATION_CONTRACT.md'
      - '.github/workflows/epistemic-observation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/population/observation.ts'
      - 'lib/game/population/observation.test.ts'
      - 'lib/game/population/types.ts'
      - 'docs/core/EPISTEMIC_OBSERVATION_CONTRACT.md'
      - '.github/workflows/epistemic-observation.yml'

jobs:
  epistemic-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile epistemic observation contract
        run: pnpm exec tsc lib/game/population/observation.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .epistemic-observation-test
      - name: Run epistemic observation contract
        run: node .epistemic-observation-test/game/population/observation.test.js
