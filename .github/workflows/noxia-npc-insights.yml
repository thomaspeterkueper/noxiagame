name: NOXIA NPC insights regression

on:
  pull_request:
    paths:
      - 'lib/game/administration/npcInsightOverview.ts'
      - 'lib/game/administration/npcInsightOverview.test.ts'
      - 'app/api/admin/npcs/insights/route.ts'
      - 'app/admin/npcs/page.tsx'
      - '.github/workflows/noxia-npc-insights.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noxia-npc-insights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  insights-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile and execute privacy-safe insights regression
        run: |
          npx --yes --package typescript@5.8.3 -- tsc lib/game/administration/npcInsightOverview.test.ts --target ES2022 --module commonjs --moduleResolution node --skipLibCheck --outDir .npc-insights-test
          node .npc-insights-test/npcInsightOverview.test.js
