name: Resonance reading and NPC chat validation

on:
  pull_request:
    paths:
      - 'app/earth/LandmarkWalkableInterior.tsx'
      - 'app/api/game/npc-conversation/route.ts'
      - 'lib/game/landmarks/**'
      - 'scripts/resonance-reading-guard.test.mjs'
      - '.github/workflows/resonance-reading-chat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Targeted regression checks
        run: node --test scripts/resonance-reading-guard.test.mjs
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build
