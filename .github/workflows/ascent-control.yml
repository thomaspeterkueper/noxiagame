name: Ascent Control

on:
  pull_request:
    paths:
      - 'lib/game/ascentControl.ts'
      - 'lib/game/ascentControl.test.ts'
      - 'lib/game/ascentTargets.ts'
      - 'lib/game/ascentPersistence.contract.test.ts'
      - 'lib/game/ascentReadiness.contract.test.ts'
      - 'lib/game/ascentExecution.contract.test.ts'
      - 'lib/game/orbitalPresence.contract.test.ts'
      - 'lib/game/core/ascentPersistence.ts'
      - 'lib/game/core/ascentReadiness.ts'
      - 'lib/game/core/ascentExecution.ts'
      - 'lib/game/core/ascentCrew.ts'
      - 'lib/game/core/earthAscentEngineeringAuthority.ts'
      - 'lib/game/core/orbitalPresence.ts'
      - 'app/api/game/ascent/route.ts'
      - 'app/api/game/ascent/readiness/route.ts'
      - 'app/api/game/ascent/crew/route.ts'
      - 'app/dashboard/EarthOrbitFlightPanel.tsx'
      - 'app/dashboard/DashboardGate.tsx'
      - 'supabase/migrations/20260919152000_persistent_ascent_core.sql'
      - 'supabase/migrations/20260919170000_orbital_presence_from_ascent.sql'
      - 'supabase/migrations/20260919184500_ascent_player_crew_manifest.sql'
      - '.github/workflows/ascent-control.yml'
  push:
    paths:
      - 'lib/game/ascentControl.ts'
      - 'lib/game/ascentControl.test.ts'
      - 'lib/game/ascentTargets.ts'
      - 'lib/game/ascentPersistence.contract.test.ts'
      - 'lib/game/ascentReadiness.contract.test.ts'
      - 'lib/game/ascentExecution.contract.test.ts'
      - 'lib/game/orbitalPresence.contract.test.ts'
      - 'lib/game/core/ascentPersistence.ts'
      - 'lib/game/core/ascentReadiness.ts'
      - 'lib/game/core/ascentExecution.ts'
      - 'lib/game/core/ascentCrew.ts'
      - 'lib/game/core/earthAscentEngineeringAuthority.ts'
      - 'lib/game/core/orbitalPresence.ts'
      - 'app/api/game/ascent/route.ts'
      - 'app/api/game/ascent/readiness/route.ts'
      - 'app/api/game/ascent/crew/route.ts'
      - 'app/dashboard/EarthOrbitFlightPanel.tsx'
      - 'app/dashboard/DashboardGate.tsx'
      - 'supabase/migrations/20260919152000_persistent_ascent_core.sql'
      - 'supabase/migrations/20260919170000_orbital_presence_from_ascent.sql'
      - 'supabase/migrations/20260919184500_ascent_player_crew_manifest.sql'
      - '.github/workflows/ascent-control.yml'

jobs:
  ascent-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile and run ascent-control contract tests
        run: |
          rm -rf .ascent-control-test
          npx tsc \
            lib/game/ascentControl.test.ts \
            lib/game/ascentPersistence.contract.test.ts \
            lib/game/ascentReadiness.contract.test.ts \
            lib/game/ascentExecution.contract.test.ts \
            lib/game/orbitalPresence.contract.test.ts \
            --target ES2022 --module commonjs --moduleResolution node \
            --esModuleInterop --skipLibCheck --rootDir lib --outDir .ascent-control-test
          node .ascent-control-test/game/ascentControl.test.js
          node .ascent-control-test/game/ascentPersistence.contract.test.js
          node .ascent-control-test/game/ascentReadiness.contract.test.js
          node .ascent-control-test/game/ascentExecution.contract.test.js
          node .ascent-control-test/game/orbitalPresence.contract.test.js
