name: Sync active Moon terrain metrics

# Schreibt mit SUPABASE_SERVICE_ROLE_KEY in die Produktionsdatenbank.
# Nur manuell auslösen (NOXIA-AGENT-INFRA-0001, Maßnahme M3) – kein automatischer Lauf beim Merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-moon-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund server-only tsx
      - name: Sync active terrain metrics through canonical runtime
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx scripts/sync-active-terrain.ts moon
