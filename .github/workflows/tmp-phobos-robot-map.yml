name: tmp-phobos-robot-map
on:
  push:
    branches: [feat/phobos-robot-map]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phobos-robot-map
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch map and dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('app/components/PlanetarySurfaceMap.tsx')
          s = p.read_text()
          s = replace_once(s,
          "export type PreparedCorridor = { id: string; points: SurfaceRoutePoint[]; kind?: 'prepared-track' | 'hardened-road' }\n\ntype Props = {",
          "export type PreparedCorridor = { id: string; points: SurfaceRoutePoint[]; kind?: 'prepared-track' | 'hardened-road' }\nexport type MobileSurfaceObject = { id: string; label: string; xM: number; yM: number; role?: string; phase?: string; status?: string; accent?: string }\n\ntype Props = {",
          'mobile type')
          s = replace_once(s,
          "  corridors?: PreparedCorridor[]\n  onOpenWorldObject?: (entity: PlanetarySurfaceEntity) => void",
          "  corridors?: PreparedCorridor[]\n  mobileObjects?: MobileSurfaceObject[]\n  onOpenWorldObject?: (entity: PlanetarySurfaceEntity) => void",
          'mobile prop')
          s = replace_once(s,
          "export default function PlanetarySurfaceMap({ locationSlug, body, mapLabel, terrainLabel, minimumWorldSpanM = 600, corridors = [], onOpenWorldObject }: Props) {",
          "export default function PlanetarySurfaceMap({ locationSlug, body, mapLabel, terrainLabel, minimumWorldSpanM = 600, corridors = [], mobileObjects = [], onOpenWorldObject }: Props) {",
          'mobile destructure')
          s = replace_once(s,
          "    for (const route of routes) points.push(...route.geometry.points)\n    for (const corridor of corridors) points.push(...corridor.points)\n    return points\n  }, [terrainGrid, entities, pendingBuilds, nodes, routes, corridors])",
          "    for (const route of routes) points.push(...route.geometry.points)\n    for (const corridor of corridors) points.push(...corridor.points)\n    for (const object of mobileObjects) points.push({ xM: object.xM, yM: object.yM })\n    return points\n  }, [terrainGrid, entities, pendingBuilds, nodes, routes, corridors, mobileObjects])",
          'bounds')
          route_render = "          {layers.routes && routes.map(route => { const points = route.geometry.points.map(point => { const p = project(point); return `${p.x},${p.y}` }).join(' '), vehicle = project(route.vehiclePoint); return <g key={route.job.id}><polyline points={points} fill=\"none\" stroke=\"#c09a3a\" strokeWidth={3 / zoom} strokeDasharray={`${7 / zoom} ${5 / zoom}`} opacity=\".75\"/><circle cx={vehicle.x} cy={vehicle.y} r={7 / zoom} fill=\"#d7b44d\" stroke=\"#fff5c9\" strokeWidth={2 / zoom} filter={`url(#planetary-glow-${body})`}/></g> })}\n"
          mobile_render = route_render + "          {layers.logistics && mobileObjects.map(object => { const p=project({xM:object.xM,yM:object.yM}), accent=object.accent??'#72c8d5', role=(object.role??'R').slice(0,1).toUpperCase(); return <g key={`mobile-${object.id}`} transform={`translate(${p.x} ${p.y})`} pointerEvents=\"none\"><circle r={10/zoom} fill=\"#081319\" fillOpacity=\".88\" stroke={accent} strokeWidth={2.2/zoom} filter={`url(#planetary-glow-${body})`}/><circle r={4.5/zoom} fill={accent}/><text x={12/zoom} y={-7/zoom} fill=\"#f5f2e8\" fontSize={9/zoom} fontWeight=\"800\" stroke=\"#071014\" strokeWidth={2.5/zoom} paintOrder=\"stroke\">{role} · {object.label.replace('Stickney ','').replace(' Robot 01','')}</text><text x={12/zoom} y={4/zoom} fill={accent} fontSize={7/zoom} fontWeight=\"700\" stroke=\"#071014\" strokeWidth={2/zoom} paintOrder=\"stroke\">{object.phase??object.status??''}</text><title>{`${object.label} · ${object.phase??object.status??''}`}</title></g> })}\n"
          s = replace_once(s, route_render, mobile_render, 'mobile render')
          p.write_text(s)

          p = Path('app/dashboard/DashboardPhobosSurface.tsx')
          s = p.read_text()
          s = replace_once(s,
          "import PlanetarySurfaceMap, { type PlanetarySurfaceEntity, type PreparedCorridor } from '@/app/components/PlanetarySurfaceMap'",
          "import PlanetarySurfaceMap, { type MobileSurfaceObject, type PlanetarySurfaceEntity, type PreparedCorridor } from '@/app/components/PlanetarySurfaceMap'",
          'dashboard map import')
          s = replace_once(s,
          "import { getToken } from '@/lib/supabase/auth'\n",
          "import { getToken } from '@/lib/supabase/auth'\nimport { deriveStickneyFleetMapMarkers } from '@/lib/game/vehicles/stickneyFleetMotion'\n",
          'motion import')
          s = replace_once(s,
          "  const [interiorEntity,setInteriorEntity]=useState<PlanetarySurfaceEntity|null>(null),[dockEntity,setDockEntity]=useState<PlanetarySurfaceEntity|null>(null),[navigationOpen,setNavigationOpen]=useState(false),[shipyardOpen,setShipyardOpen]=useState(false),[warehouseOpen,setWarehouseOpen]=useState(false),[logisticsOpen,setLogisticsOpen]=useState(false),[tick,setTick]=useState(0)\n",
          "  const [interiorEntity,setInteriorEntity]=useState<PlanetarySurfaceEntity|null>(null),[dockEntity,setDockEntity]=useState<PlanetarySurfaceEntity|null>(null),[navigationOpen,setNavigationOpen]=useState(false),[shipyardOpen,setShipyardOpen]=useState(false),[warehouseOpen,setWarehouseOpen]=useState(false),[logisticsOpen,setLogisticsOpen]=useState(false),[tick,setTick]=useState(0)\n  const [fleetRobots,setFleetRobots]=useState<any[]>([]),[fleetJobs,setFleetJobs]=useState<any[]>([]),[fleetNow,setFleetNow]=useState(()=>Date.now())\n",
          'fleet state')
          terrain_effect = "  useEffect(()=>{if(location!=='phobos')return;let cancelled=false;(async()=>{try{const token=await getToken();if(!token||cancelled)return;await fetch('/api/game/build/spatial/terrain-sync',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({location:'phobos'})})}catch{}})();return()=>{cancelled=true}},[location])\n"
          fleet_effect = terrain_effect + "  useEffect(()=>{if(location!=='phobos')return;let cancelled=false;const loadFleet=async()=>{try{const token=await getToken();if(!token||cancelled)return;const response=await fetch('/api/game/phobos/pilot-extraction',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const payload=await response.json();if(!cancelled&&response.ok){setFleetRobots(Array.isArray(payload.robots)?payload.robots:[]);setFleetJobs(Array.isArray(payload.jobs)?payload.jobs:[])}}catch{}};void loadFleet();const timer=window.setInterval(()=>void loadFleet(),15000);return()=>{cancelled=true;window.clearInterval(timer)}},[location])\n  useEffect(()=>{if(location!=='phobos')return;const timer=window.setInterval(()=>setFleetNow(Date.now()),1000);return()=>window.clearInterval(timer)},[location])\n  const robotMapObjects=useMemo<MobileSurfaceObject[]>(()=>deriveStickneyFleetMapMarkers(fleetRobots,fleetJobs,fleetNow),[fleetRobots,fleetJobs,fleetNow])\n"
          s = replace_once(s, terrain_effect, fleet_effect, 'fleet effect')
          s = replace_once(s,
          "      corridors={PHOBOS_CORRIDORS}\n      onOpenWorldObject={openWorldObject}",
          "      corridors={PHOBOS_CORRIDORS}\n      mobileObjects={robotMapObjects}\n      onOpenWorldObject={openWorldObject}",
          'map prop')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-phobos-robot-map.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/PlanetarySurfaceMap.tsx app/dashboard/DashboardPhobosSurface.tsx lib/game/vehicles/stickneyFleetMotion.ts .github/workflows/tmp-phobos-robot-map.yml
          git commit -m "feat(phobos): render Stickney robot fleet on terrain map"
          git push origin HEAD:feat/phobos-robot-map
