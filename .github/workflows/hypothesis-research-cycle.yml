name: Hypothesis research cycle
on:
  pull_request:
    paths:
      - 'lib/game/population/hypothesisResearch.ts'
      - 'lib/game/population/hypothesisResearch.test.ts'
      - '.github/workflows/hypothesis-research-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/population/hypothesisResearch.ts'
      - 'lib/game/population/hypothesisResearch.test.ts'
jobs:
  research-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/hypothesisResearch.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .hypothesis-research-test
      - run: node .hypothesis-research-test/game/population/hypothesisResearch.test.js
