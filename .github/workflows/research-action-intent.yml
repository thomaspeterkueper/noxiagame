name: Research action-intent bridge
on:
  pull_request:
    paths:
      - 'lib/game/population/actionIntent.ts'
      - 'lib/game/population/researchCapability.ts'
      - 'lib/game/population/researchActionIntent.test.ts'
      - '.github/workflows/research-action-intent.yml'
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/researchActionIntent.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .research-intent-test
      - run: node .research-intent-test/game/population/researchActionIntent.test.js
