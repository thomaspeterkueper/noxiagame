name: Cognitive Supabase adapter

on:
  pull_request:
    paths:
      - 'lib/game/cognition/researchSupabaseStore.ts'
      - 'lib/game/cognition/researchSupabaseStore.test.ts'
      - 'lib/game/cognition/researchPersistence.ts'
      - '.github/workflows/cognitive-supabase-adapter.yml'

jobs:
  cognitive-supabase-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc lib/game/cognition/researchSupabaseStore.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .cognitive-supabase-test
      - run: node .cognitive-supabase-test/game/cognition/researchSupabaseStore.test.js
