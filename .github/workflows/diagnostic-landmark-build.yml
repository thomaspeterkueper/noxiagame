name: Diagnostic landmark build

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-landmark-build.yml'
      - 'app/earth/EarthLandmarkRegionFocus.tsx'
      - 'lib/world/spatial/earthLandmarkJourneyTarget.ts'
      - 'lib/world/spatial/earthLandmarkJourneyTarget.test.ts'
      - 'lib/legal.ts'
  workflow_dispatch:

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Reproduce Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
