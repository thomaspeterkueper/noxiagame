name: NPC dream prototype checks

on:
  pull_request:
    paths:
      - 'lib/game/knowledge/dreamKnowledge*'
      - 'lib/game/knowledge/dreamInquiry*'
      - 'lib/game/knowledge/dreamActionIntent*'
      - 'lib/game/knowledge/dreamActionAdmission*'
      - 'lib/game/knowledge/dreamCyclePreview*'
      - 'lib/game/knowledge/dreamPopulationBridge*'
      - 'lib/game/cognition/npcDreamPreview*'
      - '.github/workflows/npc-dream-checks.yml'
  workflow_dispatch:

jobs:
  dream-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and compile focused tests
        run: |
          pnpm exec tsc lib/game/knowledge/dreamKnowledge.test.ts lib/game/knowledge/dreamInquiry.test.ts lib/game/knowledge/dreamInquiryDecision.test.ts lib/game/knowledge/dreamActionIntent.test.ts lib/game/knowledge/dreamActionAdmission.test.ts lib/game/knowledge/dreamCyclePreview.test.ts lib/game/knowledge/dreamPopulationBridge.test.ts lib/game/cognition/npcDreamPreview.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .dream-test
      - name: Run focused dream tests
        run: |
          node .dream-test/game/knowledge/dreamKnowledge.test.js
          node .dream-test/game/knowledge/dreamInquiry.test.js
          node .dream-test/game/knowledge/dreamInquiryDecision.test.js
          node .dream-test/game/knowledge/dreamActionIntent.test.js
          node .dream-test/game/knowledge/dreamActionAdmission.test.js
          node .dream-test/game/knowledge/dreamCyclePreview.test.js
          node .dream-test/game/knowledge/dreamPopulationBridge.test.js
          node .dream-test/game/cognition/npcDreamPreview.test.js
      - name: Existing knowledge transmission regression
        run: pnpm run test:knowledge-transmission
