name: Research value contract
on:
  pull_request:
    paths:
      - 'lib/game/population/researchValue.ts'
      - 'lib/game/population/researchValue.test.ts'
      - '.github/workflows/research-value.yml'
jobs:
  research-value:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/researchValue.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .research-value-test
      - run: node .research-value-test/game/population/researchValue.test.js
