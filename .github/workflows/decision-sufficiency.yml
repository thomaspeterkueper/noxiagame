name: Decision sufficiency contract

on:
  pull_request:
    paths:
      - 'lib/game/population/decisionSufficiency.ts'
      - 'lib/game/population/decisionSufficiency.test.ts'
      - 'lib/game/population/informationGatheringIntent.ts'
      - 'lib/game/population/informationGatheringIntent.test.ts'
      - '.github/workflows/decision-sufficiency.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/population/decisionSufficiency.ts'
      - 'lib/game/population/decisionSufficiency.test.ts'
      - '.github/workflows/decision-sufficiency.yml'

jobs:
  sufficiency-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/decisionSufficiency.test.ts lib/game/population/informationGatheringIntent.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .decision-sufficiency-test
      - run: node .decision-sufficiency-test/game/population/decisionSufficiency.test.js
      - run: node .decision-sufficiency-test/game/population/informationGatheringIntent.test.js
