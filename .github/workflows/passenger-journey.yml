name: Passenger journey contract

on:
  pull_request:
    paths:
      - 'lib/game/passengerJourney.ts'
      - 'lib/game/passengerJourney.test.ts'
      - 'lib/world/spatial/earthPassengerJourney.ts'
      - 'app/api/earth/journey/draft/route.ts'
      - 'app/earth/EarthLandmarkRegionFocus.tsx'
      - '.github/workflows/passenger-journey.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/passengerJourney.ts'
      - 'lib/game/passengerJourney.test.ts'

jobs:
  passenger-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc lib/game/passengerJourney.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .passenger-journey-test
      - run: node .passenger-journey-test/game/passengerJourney.test.js
