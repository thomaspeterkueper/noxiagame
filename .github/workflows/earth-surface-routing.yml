name: Earth surface routing

on:
  pull_request:
    paths:
      - 'lib/game/earthSurfaceRouting.ts'
      - 'lib/game/earthSurfaceRouting.test.ts'
      - 'lib/game/earthSurfaceMission.ts'
      - 'lib/game/earthSurfaceMission.test.ts'
      - 'lib/game/earthSurfaceRouteGeometry.ts'
      - 'lib/game/earthSurfaceRouteGeometry.test.ts'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/earthSurfaceLogistics.test.ts'
      - 'lib/game/earthSurfaceHandover.ts'
      - 'lib/game/earthSurfaceHandover.test.ts'
      - 'lib/game/earthTransportOverlay.ts'
      - 'lib/game/earthTransportOverlay.test.ts'
      - 'lib/game/earthTransportRulePreview.ts'
      - 'lib/game/earthTransportRulePreview.test.ts'
      - 'lib/game/vehicles/surfaceRouteGeometry.ts'
      - 'lib/world/spatial/earthFeatureSource.ts'
      - 'lib/world/spatial/earthSpatial.ts'
      - '.github/workflows/earth-surface-routing.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/earthSurfaceRouting.ts'
      - 'lib/game/earthSurfaceRouting.test.ts'
      - 'lib/game/earthSurfaceMission.ts'
      - 'lib/game/earthSurfaceMission.test.ts'
      - 'lib/game/earthSurfaceRouteGeometry.ts'
      - 'lib/game/earthSurfaceRouteGeometry.test.ts'
      - 'lib/game/earthSurfaceLogistics.ts'
      - 'lib/game/earthSurfaceLogistics.test.ts'
      - 'lib/game/earthSurfaceHandover.ts'
      - 'lib/game/earthSurfaceHandover.test.ts'
      - 'lib/game/earthTransportOverlay.ts'
      - 'lib/game/earthTransportOverlay.test.ts'
      - 'lib/game/earthTransportRulePreview.ts'
      - 'lib/game/earthTransportRulePreview.test.ts'
      - 'lib/game/vehicles/surfaceRouteGeometry.ts'
      - 'lib/world/spatial/earthFeatureSource.ts'
      - 'lib/world/spatial/earthSpatial.ts'
      - '.github/workflows/earth-surface-routing.yml'

jobs:
  earth-surface-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify shared transport suite
        run: npm run test:transport
      - name: Verify Earth OSM routing
        run: >-
          npx tsc lib/game/earthSurfaceRouting.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-routing-test
          && node .earth-routing-test/game/earthSurfaceRouting.test.js
      - name: Verify Earth → shared surface mission adapter
        run: >-
          npx tsc lib/game/earthSurfaceMission.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-mission-test
          && node .earth-mission-test/game/earthSurfaceMission.test.js
      - name: Verify Earth → shared route geometry projection
        run: >-
          npx tsc lib/game/earthSurfaceRouteGeometry.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-geometry-test
          && node .earth-geometry-test/game/earthSurfaceRouteGeometry.test.js
      - name: Verify Earth surface handover chain
        run: >-
          npx tsc lib/game/earthSurfaceHandover.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-logistics-test
          && node .earth-logistics-test/game/earthSurfaceHandover.test.js
      - name: Verify Earth transport map overlay
        run: >-
          npx tsc lib/game/earthTransportOverlay.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-logistics-test
          && node .earth-logistics-test/game/earthTransportOverlay.test.js
      - name: Verify Earth automatic transport rule preview
        run: >-
          npx tsc lib/game/earthTransportRulePreview.test.ts
          --target ES2022 --module commonjs --moduleResolution node
          --esModuleInterop --skipLibCheck --rootDir lib --outDir .earth-logistics-test
          && node .earth-logistics-test/game/earthTransportRulePreview.test.js
