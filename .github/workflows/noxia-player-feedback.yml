name: NOXIA player feedback contract
on:
  pull_request:
    paths:
      - 'lib/game/evolution/playerFeedback.ts'
      - 'lib/game/evolution/playerFeedback.test.ts'
      - 'lib/game/evolution/conversationFeedbackBridge.ts'
      - 'lib/game/evolution/conversationFeedbackBridge.test.ts'
      - 'lib/game/evolution/playerFeedbackLocalCopy.ts'
      - 'lib/game/evolution/playerFeedbackLocalCopy.test.ts'
      - 'app/earth/feedback/**'
      - '.github/workflows/noxia-player-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noxia-player-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate feedback contract, conversation bridge and local export
        run: |
          npx --yes --package typescript@5.8.3 -- tsc lib/game/evolution/playerFeedback.test.ts lib/game/evolution/conversationFeedbackBridge.test.ts lib/game/evolution/playerFeedbackLocalCopy.test.ts --target ES2022 --module commonjs --moduleResolution node --skipLibCheck --outDir .player-feedback-test
          node .player-feedback-test/playerFeedback.test.js
          node .player-feedback-test/conversationFeedbackBridge.test.js
          node .player-feedback-test/playerFeedbackLocalCopy.test.js
