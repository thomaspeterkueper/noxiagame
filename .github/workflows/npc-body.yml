name: NPC body causal test
on:
  pull_request:
    paths:
      - 'lib/game/cognition/personBody*'
      - 'lib/game/cognition/personReflex.ts'
      - 'lib/game/cognition/personAffect.ts'
      - '.github/workflows/npc-body.yml'
  push:
    branches: [feat/body-interoception-v01]
  workflow_dispatch:
jobs:
  body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:person-body
