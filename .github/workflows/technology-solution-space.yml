name: Technology solution-space contract
on:
  pull_request:
    paths:
      - 'lib/game/population/technologySolutionSpace.ts'
      - 'lib/game/population/technologySolutionSpace.test.ts'
      - '.github/workflows/technology-solution-space.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/technologySolutionSpace.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .technology-solution-test
      - run: node .technology-solution-test/game/population/technologySolutionSpace.test.js
