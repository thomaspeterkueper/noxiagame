name: Survey domain

on:
  pull_request:
    paths:
      - 'lib/game/explorationAssets.ts'
      - 'lib/game/resourceScanning.ts'
      - 'lib/game/vehicles/surveyPlatforms.ts'
      - 'lib/game/vehicles/surveyPlatforms.test.ts'
      - '.github/workflows/survey-domain.yml'
  push:
    branches: [main]
    paths:
      - 'lib/game/explorationAssets.ts'
      - 'lib/game/resourceScanning.ts'
      - 'lib/game/vehicles/surveyPlatforms.ts'
      - 'lib/game/vehicles/surveyPlatforms.test.ts'
      - '.github/workflows/survey-domain.yml'

jobs:
  survey-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate survey platform contract
        run: |
          rm -rf .survey-test
          pnpm exec tsc lib/game/vehicles/surveyPlatforms.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .survey-test
          node .survey-test/game/vehicles/surveyPlatforms.test.js
