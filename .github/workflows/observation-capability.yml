name: Observation capability contract
on:
  pull_request:
    paths:
      - 'lib/game/population/observationCapability.ts'
      - 'lib/game/population/observationCapability.test.ts'
      - '.github/workflows/observation-capability.yml'
jobs:
  capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc lib/game/population/observationCapability.test.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --rootDir lib --outDir .observation-capability-test
      - run: node .observation-capability-test/game/population/observationCapability.test.js
