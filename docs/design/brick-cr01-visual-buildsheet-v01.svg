<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <style>
    .title{font:700 34px sans-serif}.h{font:700 22px sans-serif}.t{font:16px sans-serif}.s{stroke:#222;stroke-width:3;fill:none}.frame{fill:#333}.panel{fill:#f2f2f2;stroke:#444;stroke-width:2}.cargo{fill:#c9c9c9;stroke:#444;stroke-width:2}.service{fill:#ddd;stroke:#444;stroke-width:2}.wheel{fill:#111;stroke:#555;stroke-width:3}.hub{fill:#aaa;stroke:#444;stroke-width:2}.mark{fill:#d99b00}.sensor{fill:#555}.arrow{stroke:#555;stroke-width:3;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text x="40" y="50" class="title">NOXIA CR-01 Cargo Rover — Visual Build Sheet v0.1</text>
  <text x="40" y="82" class="t">Schematic only — proportions follow current brick prototype; exact pin/hole positions still require Studio/LDraw validation.</text>

  <g transform="translate(40,120)">
    <rect width="400" height="360" rx="18" class="panel"/>
    <text x="20" y="35" class="h">1. Ladder frame</text>
    <rect x="105" y="80" width="28" height="220" class="frame"/>
    <rect x="265" y="80" width="28" height="220" class="frame"/>
    <rect x="105" y="95" width="188" height="24" class="frame"/>
    <rect x="105" y="155" width="188" height="24" class="frame"/>
    <rect x="105" y="220" width="188" height="24" class="frame"/>
    <rect x="105" y="275" width="188" height="24" class="frame"/>
    <text x="60" y="330" class="t">10-stud structural width</text>
  </g>

  <g transform="translate(500,120)">
    <rect width="400" height="360" rx="18" class="panel"/>
    <text x="20" y="35" class="h">2. Wheel module ×6</text>
    <line x1="100" y1="200" x2="220" y2="200" class="s"/>
    <line x1="155" y1="200" x2="205" y2="150" class="s"/>
    <circle cx="280" cy="200" r="58" class="wheel"/>
    <circle cx="280" cy="200" r="28" class="hub"/>
    <line x1="220" y1="200" x2="280" y2="200" class="s"/>
    <text x="70" y="285" class="t">5L arm + local brace + 8L axle</text>
    <text x="110" y="315" class="t">56×26 tyre / 30.4×20 wheel</text>
  </g>

  <g transform="translate(960,120)">
    <rect width="400" height="360" rx="18" class="panel"/>
    <text x="20" y="35" class="h">3. Rolling chassis</text>
    <rect x="150" y="65" width="100" height="230" class="frame"/>
    <circle cx="95" cy="100" r="38" class="wheel"/><circle cx="305" cy="100" r="38" class="wheel"/>
    <circle cx="95" cy="180" r="38" class="wheel"/><circle cx="305" cy="180" r="38" class="wheel"/>
    <circle cx="95" cy="260" r="38" class="wheel"/><circle cx="305" cy="260" r="38" class="wheel"/>
    <line x1="133" y1="100" x2="150" y2="100" class="s"/><line x1="250" y1="100" x2="267" y2="100" class="s"/>
    <line x1="133" y1="180" x2="150" y2="180" class="s"/><line x1="250" y1="180" x2="267" y2="180" class="s"/>
    <line x1="133" y1="260" x2="150" y2="260" class="s"/><line x1="250" y1="260" x2="267" y2="260" class="s"/>
    <text x="90" y="330" class="t">Target outside width ≈ 18 studs</text>
  </g>

  <g transform="translate(40,520)">
    <rect width="400" height="400" rx="18" class="panel"/>
    <text x="20" y="35" class="h">4. Cargo deck</text>
    <rect x="100" y="95" width="200" height="240" class="cargo"/>
    <circle cx="120" cy="115" r="10" class="mark"/><circle cx="280" cy="115" r="10" class="mark"/>
    <circle cx="120" cy="315" r="10" class="mark"/><circle cx="280" cy="315" r="10" class="mark"/>
    <rect x="150" y="150" width="100" height="130" fill="#eee" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="145" y="210" class="t">8×12</text><text x="128" y="235" class="t">removable</text>
    <text x="85" y="365" class="t">4-point S3 payload interface</text>
  </g>

  <g transform="translate(500,520)">
    <rect width="400" height="400" rx="18" class="panel"/>
    <text x="20" y="35" class="h">5. Front + rear modules</text>
    <rect x="85" y="90" width="230" height="90" class="service"/>
    <circle cx="125" cy="125" r="10" class="sensor"/><circle cx="155" cy="125" r="10" class="sensor"/><circle cx="185" cy="125" r="10" class="sensor"/>
    <line x1="255" y1="90" x2="255" y2="55" class="s"/>
    <text x="120" y="210" class="t">Front: sensor/control block</text>
    <rect x="85" y="255" width="230" height="85" class="service"/>
    <rect x="110" y="275" width="70" height="20" fill="#777"/>
    <line x1="210" y1="280" x2="280" y2="280" class="s"/>
    <line x1="210" y1="310" x2="280" y2="310" class="s"/>
    <circle cx="290" cy="280" r="8" class="mark"/><circle cx="290" cy="310" r="8" class="mark"/>
    <text x="115" y="375" class="t">Rear: power/service block</text>
  </g>

  <g transform="translate(960,520)">
    <rect width="400" height="400" rx="18" class="panel"/>
    <text x="20" y="35" class="h">6. Final top view</text>
    <rect x="140" y="70" width="120" height="85" class="service"/>
    <rect x="130" y="155" width="140" height="145" class="cargo"/>
    <rect x="140" y="300" width="120" height="65" class="service"/>
    <circle cx="75" cy="120" r="34" class="wheel"/><circle cx="325" cy="120" r="34" class="wheel"/>
    <circle cx="75" cy="225" r="34" class="wheel"/><circle cx="325" cy="225" r="34" class="wheel"/>
    <circle cx="75" cy="330" r="34" class="wheel"/><circle cx="325" cy="330" r="34" class="wheel"/>
    <line x1="109" y1="120" x2="140" y2="120" class="s"/><line x1="260" y1="120" x2="291" y2="120" class="s"/>
    <line x1="109" y1="225" x2="130" y2="225" class="s"/><line x1="270" y1="225" x2="291" y2="225" class="s"/>
    <line x1="109" y1="330" x2="140" y2="330" class="s"/><line x1="260" y1="330" x2="291" y2="330" class="s"/>
    <text x="145" y="95" class="t">FRONT</text>
    <text x="150" y="235" class="t">CARGO</text>
    <text x="150" y="340" class="t">SERVICE</text>
  </g>
</svg>