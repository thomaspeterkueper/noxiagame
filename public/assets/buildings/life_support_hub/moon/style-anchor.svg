    </g>
    <path d="M170 260a120 70 0 0 1 240 0 120 70 0 0 1 -240 0Z" fill="url(#lshDome)" stroke="#3d7566" stroke-width="5" opacity=".92"/>
    <g stroke="#3d7566" stroke-width="2.5" opacity=".5">
