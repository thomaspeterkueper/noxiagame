    <linearGradient id="lshDome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff6ee"/><stop offset="1" stop-color="#9fd8c8"/></linearGradient>
    <filter id="lshShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".3"/></filter>
  </defs>
  <g filter="url(#lshShadow)" transform="translate(70 150)">
