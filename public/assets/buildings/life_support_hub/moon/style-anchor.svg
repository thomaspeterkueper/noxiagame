<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720">
  <!-- Eigenes Lunar-Asset 25.09.2026: ECLSS-/Lebenserhaltungsknoten,
       ersetzt das bis dahin geliehene Earth-Habitat-Asset. Kontrastreiche
