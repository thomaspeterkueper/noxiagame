<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720">
  <!-- NCML-Funktionsakzent 24.09.2026: kupfern-warm = Rohstoffgewinnung
       (Metall/Erz). Huelle bleibt hell/metallisch (frueh-lunare
       Infrastruktur per Kanon), Akzentfarbe signalisiert Funktion, nicht
       Betriebszustand. Siehe EXT-NOXIA-UNIVERSE-20260924-chromatic-
       renaissance-game-integration.md -->
  <defs>
    <radialGradient id="minePit" cx=".5" cy=".4" r=".7"><stop stop-color="#2a2420"/><stop offset="1" stop-color="#100d0b"/></radialGradient>
    <linearGradient id="mineFrame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e3d8c4"/><stop offset="1" stop-color="#9c8c6f"/></linearGradient>
    <filter id="mineShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#mineShadow)" transform="translate(60 140)">
    <ellipse cx="280" cy="380" rx="270" ry="130" fill="#1c1712" opacity=".2"/>
    <ellipse cx="280" cy="360" rx="260" ry="125" fill="url(#minePit)" stroke="#3a3128" stroke-width="6"/>
    <ellipse cx="280" cy="360" rx="150" ry="70" fill="#050403" opacity=".85"/>
    <g stroke="#5b5142" stroke-width="4" opacity=".5">
      <ellipse cx="280" cy="360" rx="210" ry="100" fill="none"/>
      <ellipse cx="280" cy="360" rx="180" ry="85" fill="none"/>
    </g>
    <g transform="translate(120 20)">
      <path d="M0 300 60 0 120 300Z" fill="url(#mineFrame)" stroke="#6b5c42" stroke-width="6"/>
      <path d="M180 300 120 0 60 300Z" fill="#c4b490" stroke="#6b5c42" stroke-width="6"/>
      <line x1="18" y1="180" x2="162" y2="180" stroke="#6b5c42" stroke-width="8"/>
      <line x1="34" y1="90" x2="146" y2="90" stroke="#6b5c42" stroke-width="6"/>
      <circle cx="90" cy="30" r="16" fill="#3d3527" stroke="#e3d8c4" stroke-width="3"/>
      <line x1="90" y1="30" x2="90" y2="280" stroke="#2a241a" stroke-width="4" stroke-dasharray="10 8"/>
    </g>
    <g fill="#e08a3c" stroke="#5c3208" stroke-width="2">
      <circle cx="60" cy="470" r="9"/><circle cx="500" cy="470" r="9"/>
    </g>
  </g>
